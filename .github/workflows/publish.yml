name: publish

# Builds the sdist and wheel and publishes to PyPI when a GitHub release is
# published. Uses PyPI trusted publishing (no API token): the PyPI project
# must list this repository, this workflow file and the "pypi" environment
# as a trusted publisher.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Version matches the release tag
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('xvrt/__init__.py').read()).group(1))")
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "tag ${{ github.event.release.tag_name }} != v$v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xvrt/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
